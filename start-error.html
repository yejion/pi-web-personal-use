<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pi Web — 启动失败</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e8e8e8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { max-width: 480px; padding: 32px; border: 1px solid #3a3a3a; border-radius: 10px; background: #242424; }
  h1 { font-size: 18px; color: #f87171; }
  p { font-size: 13px; color: #9ca3af; line-height: 1.6; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <h1>Pi Web 启动失败</h1>
    <p id="msg">无法启动内置服务器。</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = decodeURIComponent(params.get('message') || '无法启动内置服务器。');
  </script>
</body>
</html>
