<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pi Web — 启动中</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e8e8e8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { text-align: center; }
  .logo { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 18px; }
  .spinner { width: 26px; height: 26px; margin: 0 auto 14px; border: 3px solid #3a3a3a; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Pi Web</div>
    <div class="spinner"></div>
    <div id="status">正在启动…</div>
  </div>
</body>
</html>
