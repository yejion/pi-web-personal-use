name: Build and Release Pi Web Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_allow_scripts: "true"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          echo "new_version=$ver" >> $env:GITHUB_OUTPUT
          echo "Building version: $ver"

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Electron installer
        run: npx electron-builder --win --x64 --publish never
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify app contents
        shell: pwsh
        run: |
          Write-Host "=== app dir ==="
          Get-ChildItem -Path "release/win-unpacked/resources" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
          # Hard asserts: the packaged entry is electron/main.js (package.json
          # "main") and the standalone server bundle must be present. A stale
          # root main.js means the entry diverged — fail instead of shipping it.
          if (-not (Test-Path "release/win-unpacked/resources/app/electron/main.js")) { throw "electron/main.js missing from package" }
          if (Test-Path "release/win-unpacked/resources/app/main.js") { throw "stale root main.js present in package" }
          if (-not (Test-Path "release/win-unpacked/resources/app/.next/standalone/server.js")) { throw "standalone server.js missing from package" }

      - name: List release artifacts
        run: Get-ChildItem -Path release -Recurse | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-desktop-windows-${{ steps.version.outputs.new_version }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.new_version }}"
          $tag = "v$ver"
          # gh creates the tag automatically if it doesn't exist.
          gh release create "$tag" release/*.exe release/*.yml release/*.blockmap `
            --title "Pi Web Desktop $ver" `
            --notes "Pi Web Desktop $ver`n`n- **Pi-Web-Setup-*.exe** — 安装程序（推荐，自动创建桌面快捷方式）`n- **Pi-Web-*-portable.exe** — 便携版（免安装，双击即用）`n`n> 每次构建版本号唯一（base + 时间戳），每个构建对应独立 Release。"
