name: Build and Release Pi Web Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_allow_scripts: "true"

      - name: Compute unique build version
        id: version
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          $base = ($base -split '-')[0]
          $stamp = Get-Date -Format "yyyyMMddHHmm"
          # Standard semver with prerelease build number: 0.8.1-build.202608091641
          $newVersion = "$(node -p "require('./package.json').version.split('-')[0]")-build.$stamp"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$newVersion';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "Build version: $newVersion"

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Electron installer
        run: npx electron-builder --win --x64
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        run: Get-ChildItem -Path release -Recurse | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-desktop-windows-${{ steps.version.outputs.new_version }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.new_version }}"
          $tag = "v$ver"
          # gh creates the tag automatically if it doesn't exist.
          gh release create "$tag" release/*.exe release/*.yml release/*.blockmap `
            --title "Pi Web Desktop $ver" `
            --notes "Pi Web Desktop $ver`n`n- **Pi-Web-Setup-*.exe** — 安装程序（推荐，自动创建桌面快捷方式）`n- **Pi-Web-*-portable.exe** — 便携版（免安装，双击即用）`n`n> 每次构建版本号唯一（base + 时间戳），每个构建对应独立 Release。"
