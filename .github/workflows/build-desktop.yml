name: Build and Release Pi Web Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_allow_scripts: "true"

      - name: Auto-bump version
        id: version
        shell: pwsh
        run: |
          # Determine bump level from the tag (e.g. v0.8.2-beta → patch by default)
          $current = node -p "require('./package.json').version"
          $base = ($current -split '-')[0]
          $parts = $base -split '\.'
          $patch = [int]$parts[2] + 1
          $newVersion = "$($parts[0]).$($parts[1]).$patch"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$newVersion';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "Bumped version to $newVersion"

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Electron installer
        run: npx electron-builder --win --x64
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-desktop-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          name: Pi Web Desktop ${{ steps.version.outputs.new_version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Pi Web Desktop ${{ steps.version.outputs.new_version }}

            - **Pi-Web-Setup-*.exe** — 安装程序（推荐，自动创建桌面快捷方式）
            - **Pi-Web-*-portable.exe** — 便携版（免安装，双击即用）
